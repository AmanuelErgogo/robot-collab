# benchmark_config_template.yaml
benchmark:
  name: skillcoord_hrc_bench
  version: "0.1.0"
  track: planner_plus_execution

task:
  domain: grocery_packing
  task_id: pack_001
  goal: Pack the requested objects into the specified bin slots.

agents:
  - name: Alice
    type: robot
    backend_defaults:
      PUT_OBJECT_IN_CONTAINER: act
  - name: Bob
    type: robot
    backend_defaults:
      PUT_OBJECT_IN_CONTAINER: rrt
  - name: Human
    type: simulated_human
    backend_defaults:
      CONFIRM_TARGET: simulated_human

planners:
  - rule_based
  - behavior_tree
  - centralized_llm
  - decentralized_llm

skills:
  - WAIT
  - PICK_OBJECT
  - PLACE_OBJECT
  - PUT_OBJECT_IN_CONTAINER
  - HOLD_CONTAINER
  - READ_LABEL
  - CONFIRM_TARGET
  - ASK_FOR_HELP

failure_injection:
  enabled: true
  scenarios:
    - none
    - robot_missed_grasp
    - human_delay
    - target_occupied
    - safety_conflict

metrics:
  primary:
    - task_success
    - recovery_success
    - redundant_work
    - passive_wait
    - safety_violations
  secondary:
    - completion_time
    - replans
    - communication_count
    - human_workload_proxy
    - fallback_rate

output:
  root: artifacts/benchmark_runs
  save_video: true
  save_event_log: true
  save_raw_csv: true
