[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocobench-pack-skills-v1"
version = "1.0.0"
description = "Versioned RoCoBench Pack Skills benchmark release"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["benchmark*"]

